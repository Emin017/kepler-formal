name: Python wheels

on:
  workflow_dispatch:
    inputs:
      published_najaeda:
        description: Build against published NajaEDA 0.7.24 instead of the local development provider
        type: boolean
        required: false
        default: false
      publish:
        description: Publish tested wheels to PyPI (main only; requires pypi environment approval)
        type: boolean
        required: false
        default: false
      version:
        description: Confirm the version in KeplerVersion.h.in when publishing (does not override it)
        type: string
        required: false
        default: ''
  pull_request:
    paths:
      - .github/workflows/python-wheels.yml
      - pyproject.toml
      - CMakeLists.txt
      - LICENSE.rst
      - src/**
      - ci/**
      - test/python/**
      - thirdparty/**
      - .gitmodules
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: python-wheels-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  generate-parser:
    name: Generate portable Verilog parser sources
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Check wheel coverage against NajaEDA
        run: |
          python -m pip install cibuildwheel==4.2.0 PyYAML
          python ci/check_wheel_matrix.py
      - name: Install parser generators
        run: sudo apt-get update && sudo apt-get install -y bison flex libfl-dev
      - name: Generate parser sources for Windows
        run: |
          cmake -S thirdparty/naja/thirdparty/naja-verilog -B parser-build -DCMAKE_BUILD_TYPE=Release
          cmake --build parser-build --target naja_verilog --parallel 2
          mkdir -p generated-parser
          cp parser-build/src/VerilogParser.cpp parser-build/src/VerilogParser.hpp parser-build/src/VerilogScanner.cpp generated-parser/
          cp parser-build/src/*.hh /usr/include/FlexLexer.h generated-parser/
      - uses: actions/upload-artifact@v4
        with:
          name: kepler-verilog-parser
          path: generated-parser/*
          if-no-files-found: error

  build:
    name: ${{ matrix.platform }} / ${{ matrix.arch }}
    needs: generate-parser
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: manylinux_2_28
            arch: x86_64
          - os: ubuntu-24.04-arm
            platform: manylinux_2_28
            arch: aarch64
          # Vendored Slang requires a newer AppleClang than Xcode 15.4 on the
          # macos-14 image.  The repository's macOS build also uses latest.
          - os: macos-latest
            platform: macOS
            arch: arm64
          - os: windows-latest
            platform: Windows
            arch: AMD64
    runs-on: ${{ matrix.os }}
    env:
      KEPLER_USE_PUBLISHED_NAJAEDA: ${{ inputs.published_najaeda && '1' || '0' }}
      # Linux builds and tests run inside a manylinux container.
      CIBW_ENVIRONMENT_PASS_LINUX: KEPLER_USE_PUBLISHED_NAJAEDA

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Prepare Python provider metadata
        run: python ci/prepare_python_release.py --project .

      - name: Install Windows wheel repair tool
        if: runner.os == 'Windows'
        run: python -m pip install delvewheel

      - name: Set up Windows SDK and MSVC environment for clang-cl
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Validate Python release request
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: python ci/prepare_python_release.py --project . --validate-publish

      - name: Verify recursive submodules
        run: git submodule status --recursive

      - name: Download generated parser for Windows
        if: runner.os == 'Windows'
        uses: actions/download-artifact@v8
        with:
          name: kepler-verilog-parser
          path: thirdparty/naja/thirdparty/naja-verilog/src/generated

      - name: Build, repair, and test wheels
        uses: pypa/cibuildwheel@v4.2.0
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
        with:
          package-dir: .
          output-dir: wheelhouse

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kepler-formal-${{ matrix.platform }}-${{ matrix.arch }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish kepler-formal ${{ inputs.version }} to PyPI
    needs: build
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.publish &&
      inputs.published_najaeda &&
      github.repository == 'keplertech/kepler-formal' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Configure required reviewers and restrict this environment to main
    # before enabling its matching PyPI Trusted Publisher.
    environment:
      name: pypi
      url: https://pypi.org/project/kepler-formal/
    permissions:
      contents: read
      id-token: write
    steps:
      # Download only this run's four tested wheel artifacts. An absent
      # artifact is an error; never publish a partial platform matrix.
      - name: Download Linux wheels
        uses: actions/download-artifact@v8
        with:
          name: kepler-formal-manylinux_2_28-x86_64
          path: dist/

      - name: Download macOS wheels
        uses: actions/download-artifact@v8
        with:
          name: kepler-formal-macOS-arm64
          path: dist/

      - name: Download Linux ARM64 wheels
        uses: actions/download-artifact@v8
        with:
          name: kepler-formal-manylinux_2_28-aarch64
          path: dist/

      - name: Download Windows wheels
        uses: actions/download-artifact@v8
        with:
          name: kepler-formal-Windows-AMD64
          path: dist/

      - name: Publish to PyPI using Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          print-hash: true
